<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="220" height="48" fill="none">
  <defs>
    <linearGradient id="electricBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Container (40x40) -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="#090E1A" stroke="url(#electricBlueGrad)" stroke-width="1.6" />
  
  <!-- Subtle inner glow -->
  <circle cx="24" cy="24" r="12" fill="#0066FF" fill-opacity="0.15" />

  <!-- Document Silhouette -->
  <path d="M14 12C14 10.8954 14.8954 10 16 10H26.5L32 15.5V36C32 37.1046 31.1046 38 30 38H16C14.8954 38 14 37.1046 14 36V12Z" fill="#111827" stroke="url(#electricBlueGrad)" stroke-width="1.3" stroke-linejoin="round" />
  <path d="M26 10V16H32" stroke="url(#electricBlueGrad)" stroke-width="1.3" stroke-linejoin="round" />

  <!-- Speed Lightning Bolt -->
  <path d="M28 17L21 26H27L24 35L31 24H26L28 17Z" fill="url(#electricBlueGrad)" filter="url(#glowEffect)" />

  <!-- Typography -->
  <text x="54" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.02em">
    Contract<tspan fill="url(#subGrad)">Press</tspan>
  </text>
  <text x="55" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" letter-spacing="0.12em">
    SMART SAAS PLATFORM
  </text>
</svg>
