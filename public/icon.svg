<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="cloudInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.05" />
    </linearGradient>
    <filter id="cloudGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="2.5" y="2.5" width="43" height="43" rx="12" fill="#0A0F1D" stroke="url(#cloudGrad)" stroke-width="1.5" stroke-opacity="0.8" />
  
  <!-- Subtle ambient glow -->
  <circle cx="24" cy="24" r="14" fill="#0066FF" fill-opacity="0.18" filter="url(#cloudGlow)" />

  <!-- Cloud Outline Shape -->
  <path d="M 14 33 C 10.5 33, 8 30.2, 8 26.5 C 8 23.2, 10.4 20.4, 13.6 20.1 C 15 15.2, 19.3 11.5, 24.5 11.5 C 30.5 11.5, 35.4 15.8, 36.4 21.5 C 39.6 22, 42 24.6, 42 28 C 42 31.5, 39.2 33, 36 33 Z" 
        fill="url(#cloudInner)" 
        stroke="url(#cloudGrad)" 
        stroke-width="1.8" 
        stroke-linejoin="round" />

  <!-- Floating Digital Contract inside Cloud -->
  <g filter="url(#cloudGlow)">
    <!-- Document Card -->
    <rect x="18" y="16" width="13" height="17" rx="2" fill="#0D1527" stroke="#00F0FF" stroke-width="1.2" />
    <path d="M 27 16 L 31 20 L 27 20 Z" fill="#0066FF" stroke="#00F0FF" stroke-width="0.8" />
    
    <!-- Contract Lines -->
    <line x1="20.5" y1="21.5" x2="25.5" y2="21.5" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" />
    <line x1="20.5" y1="24.5" x2="28" y2="24.5" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8" />
    
    <!-- Signature / Checkmark Line (Electric Cyan) -->
    <path d="M 20.5 28.5 L 23 30.5 L 28.5 27" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
