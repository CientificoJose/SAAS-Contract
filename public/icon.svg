<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="electricGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="lightningGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect x="3" y="3" width="42" height="42" rx="12" fill="#0A0F1D" stroke="url(#electricGlow)" stroke-width="1.8" />
  
  <!-- Subtle background glow -->
  <circle cx="24" cy="24" r="14" fill="#0066FF" fill-opacity="0.12" filter="url(#neonBlur)" />

  <!-- Document Silhouette -->
  <path d="M14 11C14 9.89543 14.8954 9 16 9H27.5L34 15.5V37C34 38.1046 33.1046 39 32 39H16C14.8954 39 14 38.1046 14 37V11Z" fill="#111827" stroke="url(#electricGlow)" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Document Folded Corner -->
  <path d="M27 9V16H34" stroke="url(#electricGlow)" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Contract Lines -->
  <line x1="18" y1="20" x2="24" y2="20" stroke="#00F0FF" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="18" y1="25" x2="22" y2="25" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.6" />
  <line x1="18" y1="30" x2="25" y2="30" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.4" />

  <!-- Fast/Speed Electric Lightning Bolt Overlay representing Instant Contracts -->
  <path d="M29 17L22 26H28L25 35L33 24H27L29 17Z" fill="url(#lightningGlow)" filter="url(#neonBlur)" />
</svg>
